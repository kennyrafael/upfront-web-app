name: CI

# See the api repository for why these four patterns: feature/* arrives by pull request,
# integration/* is the preview environment, release/* is a version being stabilised, main is
# production.
on:
  push:
    branches:
      - main
      # The branch a release is tested on before it reaches main, so it is the one place
      # CI failing silently would matter most.
      - staging
      - 'integration/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` before vite, so this is the type check as well as the bundle.
      - run: npm run build
      # Vitest in jsdom. Added with the first tests rather than ahead of them, so the step
      # has never been green-by-vacuousness.
      - run: npm test
